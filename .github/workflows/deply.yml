name: Deploy Portfolio

on:
  push:
    branches:
      - main

jobs:
  check:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Security audit (dependencies)
        run: npm audit --audit-level=critical
        continue-on-error: true

      - name: Run tests
        run: npm test
        continue-on-error: false

      - name: Build project
        run: npm run build

  deploy:
    runs-on: self-hosted
    needs: check

    steps:
      - name: Deploy on VPS
        run: /opt/deploy/portfolio.sh
